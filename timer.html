<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <p id="timer-display">00:00:00</p>

        <div class="timer-controls1">
          <input type="number" id="hours-input" placeholder="HH" min="0" max="23">
          <input type="number" id="minutes-input" placeholder="MM" min="0" max="59">
          <input type="number" id="seconds-input" placeholder="SS" min="0" max="59">
        </div>

        <div class="timer-controls2">
          <button onclick="startTimer()">Start</button>
          <button onclick="pauseTimer()">Pause</button>
          <button onclick="resetTimer()">Reset</button>
        </div>

        <p class="navigation">
          <a href="index.html"><button>Back to Clock</button></a>
        </p>
      </div>
    </div>

    <script src="timer.js"></script>
  </body>
</html>
