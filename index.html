<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <p id="hours">00:00:00 AM</p>

        <p class="date">Loading date...</p>

        <div class="timezone-selector">
          <label for="timezone">Select Timezone:</label>
          <select id="timezone" onchange="updateClock()">
            <option value="local">IST</option>
            <option value="America/New_York">New York (EST)</option>
            <option value="Europe/London">London (GMT)</option>
            <option value="Asia/Tokyo">Tokyo (JST)</option>
            <option value="Australia/Sydney">Sydney (AEST)</option>
          </select>
        </div>

        <p class="theme">
          <button onclick="changeTheme('default')">Light</button>
          <button onclick="changeTheme('dark-theme')">Dark</button>
          <button onclick="changeTheme('neon-theme')">Neon</button>
        </p>
        
        <p class="navigation">
          <a href="stopwatch.html"><button>Go to Stopwatch</button></a>
        </p>
      </div>
    </div>
   
    <script src="script.js"></script>
  </body>
</html>
